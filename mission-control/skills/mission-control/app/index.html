<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Mission Control · Codex agents</title>
  <meta name="description" content="A private, live roster of your Codex sessions and specialist agents.">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1 id="page-title">Agents at work</h1>
      <div class="top-controls">
        <label class="header-field session-field"><span class="sr-only">Session</span><select id="session-select" aria-label="Choose a current or older session"></select></label>
        <label class="header-field day-field"><span class="sr-only">Day</span><select id="day-select" aria-label="Choose a day"><option value="today">Today</option><option value="all">All days</option></select></label>
        <button id="refresh-button" class="refresh-button" type="button" aria-label="Refresh agent data" title="Refresh agent data">↻</button>
      </div>
    </header>

    <main class="main">
      <section id="attention-banner" class="attention-banner" aria-live="polite" hidden>
        <strong id="attention-title"></strong><span id="attention-copy"></span>
      </section>

      <section class="roster" aria-label="Agent roster">
        <div class="roster-head">
          <div class="roster-meta">
            <span id="visible-count" class="visible-count">—</span>
            <span class="checked-time">Checked <time id="last-checked">—</time></span>
          </div>
          <label class="search"><span class="sr-only">Find an agent or assignment</span><input id="agent-search" type="search" placeholder="Find agent or work" autocomplete="off"><span aria-hidden="true">⌕</span></label>
        </div>
        <div class="table-scroll">
          <table class="agent-table">
            <thead><tr><th scope="col">Agent</th><th scope="col">Assignment</th><th scope="col">State</th><th scope="col">Updated</th></tr></thead>
            <tbody id="agent-rows"></tbody>
          </table>
        </div>
        <button id="load-more" class="load-more" type="button" hidden>Show more agents <span aria-hidden="true">↓</span></button>
      </section>
    </main>
  </div>
</body>
</html>
